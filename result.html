<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#fcf6ed",
                        "secondary-fixed": "#ffc967",
                        "primary-dim": "#a30021",
                        "surface-variant": "#e2dcd1",
                        "primary-fixed": "#ff7576",
                        "surface-container-low": "#f6f0e6",
                        "on-surface-variant": "#5e5b54",
                        "on-tertiary-fixed-variant": "#5c2d00",
                        "background": "#fcf6ed",
                        "tertiary-fixed": "#ff973e",
                        "on-secondary-fixed": "#473000",
                        "outline": "#7a766f",
                        "surface-container": "#ede7dd",
                        "on-tertiary-fixed": "#2a1100",
                        "primary": "#b71029",
                        "on-primary": "#ffefee",
                        "on-secondary": "#fff1de",
                        "surface": "#fcf6ed",
                        "on-primary-container": "#4e000a",
                        "on-tertiary": "#fff0e7",
                        "primary-fixed-dim": "#ff595f",
                        "tertiary": "#8e4900",
                        "secondary-container": "#ffc967",
                        "inverse-on-surface": "#a19c95",
                        "on-error": "#ffefec",
                        "on-primary-fixed": "#000000",
                        "tertiary-dim": "#7d3f00",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb702",
                        "on-surface": "#312e29"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .confetti-bg {
            background-image: radial-gradient(circle at 20% 30%, #ff7576 2px, transparent 2px),
                              radial-gradient(circle at 80% 10%, #ffc967 3px, transparent 3px),
                              radial-gradient(circle at 50% 50%, #b71029 2px, transparent 2px),
                              radial-gradient(circle at 10% 80%, #ff973e 4px, transparent 4px),
                              radial-gradient(circle at 90% 90%, #ff7576 3px, transparent 3px);
            background-size: 100px 100px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-[#fcf6ed] dark:bg-stone-900 flex justify-between items-center px-6 py-4 w-full docked full-width top-0 z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#b71029] dark:text-[#ff7576] active:scale-95 duration-150 ease-in-out cursor-pointer">menu</span>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[#312e29] dark:text-[#fcf6ed] text-xl">Maycha Festival</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-[#b71029] active:scale-95 duration-150 ease-in-out cursor-pointer">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="User profile photo avatar circular" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLexH4hQtWhFUpWElxNbirZcESqEDypgr2CWDHp7hmRBEyeJR8GlaFYzIylYSFPJG0MSMIgyKs69CHoxyyRmRCU0ZtiINLL1PSNF5WvvLP4KqnxgQHH4o9u1fD4airm3vLX6OMbRdkFNYcBOCAcrAu6-Wm8dH5D0_7OiaJC0RC8IzwItax8Md01zxByKlx5nvRAFk7IR7KF3aLepwos2sfUb_PzLIjRUNnTjURyE84CZDw8QZNXGomHUA20fZ70LVilFb4l5MRje4"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow relative flex flex-col items-center justify-start px-6 pt-8 pb-32 confetti-bg">
<!-- Victory Header -->
<div class="text-center mb-8 relative">
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary/10 blur-[80px] rounded-full -z-10"></div>
<p class="font-label text-primary font-bold tracking-[0.2em] mb-2 uppercase">Thắng cuộc!</p>
<h2 class="font-headline text-[3.5rem] font-black text-primary leading-tight tracking-tighter drop-shadow-sm">
                Chúc mừng!
            </h2>
</div>
<!-- Result Bento Grid -->
<div class="w-full max-w-md grid grid-cols-2 gap-4 mb-8">
<!-- Time Card -->
<div class="col-span-1 bg-surface-container-low p-6 rounded-lg flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute top-0 right-0 p-2 opacity-10 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl">timer</span>
</div>
<span class="font-label text-xs text-on-surface-variant font-bold uppercase tracking-widest mb-1">Thời gian</span>
<span class="font-headline text-3xl font-extrabold text-secondary">01:45</span>
</div>
<!-- Share Card -->
<button class="col-span-1 bg-surface-container-high p-6 rounded-lg flex flex-col items-center justify-center hover:bg-secondary-container transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-secondary text-3xl mb-1">share</span>
<span class="font-label text-xs font-bold text-secondary uppercase tracking-widest">Chia sẻ</span>
</button>
<!-- Voucher Card (The Prize) -->
<div class="col-span-2 relative overflow-hidden rounded-xl bg-gradient-to-br from-primary to-primary-fixed p-1 shadow-xl">
<div class="bg-surface rounded-[calc(2rem-4px)] p-6 flex items-center justify-between border-2 border-dashed border-primary/20">
<div class="flex flex-col">
<span class="font-label text-[10px] font-bold text-primary uppercase tracking-[0.2em] mb-1">Phần thưởng lễ 30/4</span>
<h3 class="font-headline text-2xl font-black text-on-surface tracking-tight">Voucher 20k</h3>
<p class="font-body text-sm text-on-surface-variant">Áp dụng cho mọi loại trà sữa</p>
</div>
<div class="bg-primary/5 p-4 rounded-full">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
</div>
</div>
<!-- Punch holes effect -->
<div class="absolute top-1/2 -left-3 w-6 h-6 bg-surface-bright rounded-full -translate-y-1/2 shadow-inner"></div>
<div class="absolute top-1/2 -right-3 w-6 h-6 bg-surface-bright rounded-full -translate-y-1/2 shadow-inner"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-md flex flex-col gap-4 mt-auto">
<button class="w-full py-5 rounded-full bg-gradient-to-r from-primary to-primary-fixed text-on-primary font-headline font-extrabold text-lg shadow-lg hover:shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-3 relative overflow-hidden group">
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="material-symbols-outlined">replay</span>
                Chơi lại
            </button>
<button class="w-full py-4 rounded-xl bg-surface-container-highest text-on-surface font-headline font-bold text-base hover:bg-surface-variant active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">leaderboard</span>
                Xem bảng xếp hạng
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-[3rem] pb-safe bg-[#fcf6ed]/90 dark:bg-stone-900/90 backdrop-blur-xl border-t border-[#312e29]/10 dark:border-[#fcf6ed]/10 shadow-[0_-4px_20px_0_rgba(49,46,41,0.06)] flex justify-around items-center px-4 py-3">
<div class="flex flex-col items-center justify-center bg-gradient-to-br from-[#b71029] to-[#ff7576] text-white rounded-full px-5 py-2 scale-110 duration-200 ease-out cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">extension</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest">Play</span>
</div>
<div class="flex flex-col items-center justify-center text-[#795500] dark:text-[#ffc967] opacity-70 hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined">local_activity</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest">Rewards</span>
</div>
<div class="flex flex-col items-center justify-center text-[#795500] dark:text-[#ffc967] opacity-70 hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest">Ranks</span>
</div>
<div class="flex flex-col items-center justify-center text-[#795500] dark:text-[#ffc967] opacity-70 hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined">info</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest">Rules</span>
</div>
</nav>
</body></html>
